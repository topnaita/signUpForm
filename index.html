<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Login Page</title>
  </head>
  <body>
    <div class="imageContainer">
      <img
        class="card-image"
        src="./images/sideimage.avif"
        alt="Background left image"
      />
      <p class="Credit">Photo by Halie West on Unsplash</p>
      <div class="cardBodyText">
        <img class="logo" src="./images/odin-lined.png" alt="OdinProjectLogo" />

        <h1 class="odin">Odin</h1>
      </div>
    </div>
    <!-- Section right A -->
    <div class="sectionForm">
      <div class="sectionAText">
        <div class="topText">
          <p>
            This is not a real online service! you know you need something like
            this in your life to help you realize your deepest dreams. sign up
            <span>now</span> to get started
          </p>
          <br /><br />

          <p>you <span>know</span> you want to.</p>
        </div>
      </div>
      <!-- End -->
      <div class="loginContainer">
        <p class="formTextTop">Let's do this</p>
        <form class="formContainer" action="example.com/path" method="post">
          <div>
            <div class="formSectionRight">
              <label for="FirstName">First Name:</label><br />
              <input type="text" id="FirstName" name="FirstName" /><br />
              <label for="lastName">Last Name:</label><br />
              <input type="text" id="lastName" name="lastName" /><br />
              <label for="uderPassword">Password:</label><br />
              <input
                type="password"
                id="uderPassword"
                name="userPassword"
              /><br />
            </div>
          </div>
          <div class="formSectionLeft">
            <label for="phoneNumber">Phone Number:</label><br />
            <input type="text" id="phoneNumber" name="phoneNumber" /><br />
            <label for="email">Email:</label><br />
            <input type="email" id="email" name="userEmail" /><br />
            <label for="confiPassword">Confirm Password:</label><br />
            <input
              type="password"
              id="confiPassword"
              name="confirmPassword"
            /><br />
          </div>
        </form>
      </div>
      <div class="containerButtonDown">
        <div><button class="button" type="button">Create Account</button></div>

        <p class="buttonP">
          Already have an account? <span><a href="Login">Login</a></span>
        </p>
      </div>
    </div>
  </body>
</html>
